name: Dataset Integrity

on:
  push:
    branches:
      - refactor/phoenix-foundation
    paths:
      - "src/modules/dataset_studio/**"
      - "src/shared/dataset_tools/**"
      - "src/modules/phoenix_trainer/trainers/detectron2_trainer.py"
      - "tests/dataset/**"
      - ".github/workflows/dataset-integrity.yml"
  pull_request:
    paths:
      - "src/modules/dataset_studio/**"
      - "src/shared/dataset_tools/**"
      - "src/modules/phoenix_trainer/trainers/detectron2_trainer.py"
      - "tests/dataset/**"
      - ".github/workflows/dataset-integrity.yml"

jobs:
  coco-detection-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/modules/dataset_studio/dataset_studio.py
            src/modules/dataset_studio/components/professional_dataset_selector.py
            src/modules/dataset_studio/components/pipeline_compatibility_engine.py
            src/modules/dataset_studio/project_management/project_creation_dialog.py
            src/modules/dataset_studio/project_management/label_pipeline_compatibility.py
            src/shared/dataset_tools/border_quad.py
            src/shared/dataset_tools/dual_quad_dataset.py
            src/shared/dataset_tools/phoenix_contract.py
            src/shared/annotations/dual_contour_proposals/card094.json
            src/shared/dataset_tools/yolo_to_maskrcnn_converter.py
            src/shared/dataset_tools/annotation_formats.py
            src/shared/dataset_tools/dataset_validator.py
            src/shared/dataset_tools/dataset_analysis.py
            src/modules/phoenix_trainer/trainers/detectron2_trainer.py
            tests/dataset
            src/shared/annotations/combined_dual_class/images/image001F.jpg
            src/shared/annotations/combined_dual_class/images/image002F.jpg
            src/shared/annotations/combined_dual_class/images/image003F.jpg
            src/shared/annotations/combined_dual_class/images/image004F.jpg
            src/shared/annotations/combined_dual_class/labels/image001F.txt
            src/shared/annotations/combined_dual_class/labels/image002F.txt
            src/shared/annotations/combined_dual_class/labels/image003F.txt
            src/shared/annotations/combined_dual_class/labels/image004F.txt
            src/modules/dataset_studio/exports/Dataset_20261016_230734/annotations.json
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image001F.jpg
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image002F.jpg
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image003F.jpg
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image004F.jpg
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image092F.jpg
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image093F.jpg
            src/modules/dataset_studio/exports/Dataset_20261016_230734/images/image094F.jpg
            src/shared/annotations/combined_dual_class/images/image092F.jpg
            src/shared/annotations/combined_dual_class/images/image093F.jpg
            src/shared/annotations/combined_dual_class/images/image094F.jpg
            src/shared/annotations/combined_dual_class/images/card094.jpg
            src/shared/annotations/combined_dual_class/images/card095.jpg
            src/shared/annotations/combined_dual_class/images/card096.jpg
            src/shared/annotations/combined_dual_class/labels/image092F.txt
            src/shared/annotations/combined_dual_class/labels/image093F.txt
            src/shared/annotations/combined_dual_class/labels/image094F.txt
            src/shared/annotations/combined_dual_class/labels/card094.txt
            src/shared/annotations/combined_dual_class/labels/card095.txt
            src/shared/annotations/combined_dual_class/labels/card096.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal real geometry dependencies
        run: python -m pip install pytest pillow numpy opencv-python-headless
      - name: Compile production converter, exports and trainer
        run: |
          python -m py_compile \
            src/modules/dataset_studio/dataset_studio.py \
            src/shared/dataset_tools/yolo_to_maskrcnn_converter.py \
            src/shared/dataset_tools/dual_quad_dataset.py \
            src/modules/dataset_studio/components/professional_dataset_selector.py \
            src/modules/dataset_studio/components/pipeline_compatibility_engine.py \
            src/modules/dataset_studio/project_management/label_pipeline_compatibility.py \
            src/modules/dataset_studio/project_management/project_creation_dialog.py \
            src/shared/dataset_tools/annotation_formats.py \
            src/shared/dataset_tools/dataset_validator.py \
            src/shared/dataset_tools/dataset_analysis.py \
            src/modules/phoenix_trainer/trainers/detectron2_trainer.py
      - name: Verify dataset integrity and actual seven-image COCO export
        run: python -m pytest -q tests/dataset
